name: Daily Horizon Summary

on:
  schedule:
    # Retry once if the first trigger was missed or did not publish.
    - cron: '0,17 7 * * *'
      timezone: Asia/Shanghai
    # Temporary November 3 acceptance window; the edition is already delivered.
    - cron: '16,23 11 3 11 *'
      timezone: Asia/Shanghai
  workflow_dispatch:      # Allow manual trigger

concurrency:
  group: daily-horizon-summary
  cancel-in-progress: false

jobs:
  check-edition:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      generate: ${{ steps.edition.outputs.generate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          sparse-checkout: _posts

      - name: Check for today's published Chinese edition
        id: edition
        env:
          TZ: Asia/Shanghai
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == schedule && -s "_posts/$(date +%F)-summary-zh.md" ]]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

  daily-summary:
    needs: check-edition
    if: needs.check-edition.outputs.generate == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          : "${DEEPSEEK_API_KEY:?Set the DEEPSEEK_API_KEY repository secret}"
          uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Verify the Chinese edition before publishing
        run: test -s "docs/_posts/${DATE}-summary-zh.md"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
