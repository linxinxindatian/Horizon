name: WeChat Daily Briefing

on:
  schedule:
    # The second trigger covers a missed first trigger or a late edition.
    - cron: '30,47 10 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write  # Atomically reserve each edition before sending.

concurrency:
  group: horizon-wechat-delivery
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out published briefings
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published
          sparse-checkout: _posts

      - name: Locate the Chinese briefing published today
        env:
          TZ: Asia/Shanghai
        run: |
          report="published/_posts/$(date +%F)-summary-zh.md"
          if [[ ! -s "$report" ]]; then
            echo "::error::Today's Chinese edition is missing or empty."
            exit 1
          fi
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - run: uv sync --frozen

      - name: Restore encrypted WeChat session
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wechat-session.enc
          key: wechat-session-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wechat-session-v1-

      - name: Reserve this edition for delivery
        id: reserve
        env:
          HORIZON_WECHAT_SESSION: ${{ secrets.HORIZON_WECHAT_SESSION }}
        run: |
          : "${HORIZON_WECHAT_SESSION:?Set the paired session in repository secrets}"
          export DELIVERY_TAG="horizon-wechat/$(basename "$REPORT_PATH" -summary-zh.md)"
          if scripts/reserve_wechat_delivery.sh; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 10 ]]; then exit "$status"; fi
            echo "A previous run reserved this edition. See its sending result before retrying." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Chinese briefing to personal WeChat
        if: steps.reserve.outputs.send == 'true'
        env:
          HORIZON_WECHAT_SESSION: ${{ secrets.HORIZON_WECHAT_SESSION }}
        run: uv run python scripts/wechat_daily.py "$REPORT_PATH"

      - name: Save encrypted WeChat session
        if: ${{ !cancelled() && steps.reserve.outputs.send == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wechat-session.enc
          key: wechat-session-v1-${{ github.run_id }}-${{ github.run_attempt }}
